[package]
name = "runyard"
version = "0.1.0"
description = "Runyard"
authors = ["you"]
edition = "2021"

[lib]
name = "runyard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = ["tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.32", features = ["bundled"] }
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.10", features = ["v4", "serde"] }
tokio = { version = "1.0", features = ["process", "io-util", "sync", "rt", "rt-multi-thread", "macros"] }
walkdir = "2.5"
log = "0.4"
env_logger = "0.11"
dirs = "5.0"
once_cell = "1.19"
regex = "1.10"
tauri-plugin-shell = "2.0"
portable-pty = "0.8"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
tempfile = "3.10"
